[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "documentai"
dynamic = ["version"]
description = "Document parsing pipeline: documents -> PDF -> text, Markdown, JSON"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
# pymupdf4llm pins PyMuPDF and pymupdf-layout to its *exact* version, so the
# three must move together. Bump all of them at once, and in requirements.txt.
dependencies = [
    "pymupdf==1.28.2",
    "pymupdf4llm==1.28.2",
    "pymupdf-layout==1.28.2",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "python-multipart>=0.0.9"]
app = ["streamlit>=1.36"]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.16",
    "mypy>=1.14",
    "pre-commit>=4.0",
]

[project.scripts]
documentai = "documentai.cli:main"

[tool.setuptools.dynamic]
version = {attr = "documentai.__version__"}

[tool.setuptools.packages.find]
include = ["documentai*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["output", "parsed", "dataset"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "C4",  # comprehensions
    "SIM", # simplify
    "RUF", # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
# FastAPI declares parameters with File(...) / Query(...) defaults by design.
"api.py" = ["B008"]

[tool.mypy]
python_version = "3.10"
files = ["documentai", "api.py", "app.py"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[[tool.mypy.overrides]]
# Neither ships type information.
module = ["pymupdf4llm", "pymupdf4llm.*", "streamlit", "streamlit.*"]
ignore_missing_imports = true
