[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "documentai"
version = "0.1.0"
description = "Document parsing pipeline: documents -> PDF -> text, Markdown, JSON"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pymupdf>=1.24",
    "pymupdf4llm>=0.0.17",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "python-multipart>=0.0.9"]
app = ["streamlit>=1.36"]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
documentai = "documentai.cli:main"

[tool.setuptools.packages.find]
include = ["documentai*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
