# pip install -e ".[dev]" && pre-commit install
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=1000"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.5
    hooks:
      - id: ruff-check
        args: ["--fix"]

  - repo: local
    hooks:
      # mypy needs the project's own dependencies, so it runs from the
      # development environment rather than an isolated hook environment.
      - id: mypy
        name: mypy
        entry: python -m mypy
        language: system
        pass_filenames: false
        files: \.py$
